name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build library
        run: dotnet build Delimited/Delimited.fsproj -c Release

      # RELEASE ONLY: DEBUG BUILDS MISCOMPILE taskSeq CODE THAT AWAITS REAL ASYNC IO.
      - name: Test
        run: dotnet test Tests/Tests.fsproj -c Release

      - name: Pack and test package
        shell: pwsh
        run: ./test-package.ps1

  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Builds both library targets; the tests only exercise net6.0.
      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet fantomas --check .
