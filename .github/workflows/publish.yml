name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing exchanges a GitHub OIDC token for a short-lived NuGet key.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # RELEASE ONLY: DEBUG BUILDS MISCOMPILE taskSeq CODE THAT AWAITS REAL ASYNC IO.
      - name: Test
        run: dotnet test Tests/Tests.fsproj -c Release

      # Leaves the tested .nupkg in artifacts/ for the push below.
      - name: Pack and test package
        shell: pwsh
        run: ./test-package.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
